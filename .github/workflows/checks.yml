name: Offline checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Engine checks
        run: npm test
      - name: Desktop checks
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('test_network_config.py', 'test_discovery.py', 'test_project_guide.py', 'test_introductions.py', 'test_release_and_keys.py', 'desktop_regression.py')) {
            python "test/$test"
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }
